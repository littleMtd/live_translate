name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Unit tests
        run: python -m pytest tests -q
        env:
          # No real keys – all API calls are mocked in unit tests
          GROQ_API_KEY: ""

  test-real-apis:
    runs-on: ubuntu-latest
    # Only runs on push to main when secrets are available
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Detect live API credentials
        id: live-api
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is unavailable; no live API evidence was produced."
          fi

      - name: Integration tests (live Groq API)
        if: steps.live-api.outputs.enabled == 'true'
        run: python -m unittest tests/test_integration.py -v
        env:
          RUN_LIVE_TESTS: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    # Pinned: the Tauri apt packages below are distro-specific, and
    # ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Re-validate the
    # package list before moving this job to a newer image.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked
